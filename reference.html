.veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 30%, transparent 55%); }
main {
  position: relative; z-index: 2; min-height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  max-width: 34rem; padding: 3rem clamp(1.25rem, 6vw, 5.5rem); pointer-events: none;
}
main > * { pointer-events: auto; }
.hello { font-size: 1.25rem; font-weight: 500; color: var(--ink-soft); animation: up .8s cubic-bezier(.2,.8,.2,1) .2s both; }
h1 {
  font-weight: 800; font-stretch: 75%; font-variation-settings: "opsz" 96;
  font-size: clamp(4rem, 11vw, 9.5rem); line-height: .84; letter-spacing: -.035em;
  margin: .4rem 0 1.5rem; animation: up 1s cubic-bezier(.2,.8,.2,1) .3s both;
}
.lede { max-width: 30ch; font-size: 1.2rem; color: var(--ink-soft); animation: up 1s cubic-bezier(.2,.8,.2,1) .45s both; }
form { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: .5rem; max-width: 27rem; animation: up 1s cubic-bezier(.2,.8,.2,1) .6s both; }
label { flex-basis: 100%; font-weight: 650; font-size: .95rem; }
input {
  flex: 1 1 13rem; min-width: 0; font: inherit; color: var(--ink);
  padding: .85rem 1rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field);
}
input::placeholder { color: var(--ink-soft); opacity: .7; }
button {
  font: 700 1rem "Bricolage Grotesque", system-ui, sans-serif; padding: .85rem 1.3rem;
  border: 0; border-radius: 10px; background: var(--accent); color: #123D36; cursor: pointer;
}
button:hover { filter: brightness(1.06); }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.msg { flex-basis: 100%; min-height: 1.5em; font-size: .95rem; color: var(--ink-soft); }
.hint { margin-top: 1.25rem; font-size: .9rem; color: var(--ink-soft); }
.stamp {
  position: fixed; z-index: 2; right: clamp(1rem, 5vw, 4rem); bottom: clamp(1rem, 5vh, 3.5rem);
  width: clamp(6.5rem, 12vw, 9rem); aspect-ratio: 1; animation: spin 24s linear infinite;
}
.stamp svg { width: 100%; height: 100%; display: block; }
@media (max-width: 760px) {
  .stage { position: relative; height: 62vh; }
  .grain { position: fixed; }
  .veil { display: none; }
  main { min-height: 0; padding-top: 1rem; max-width: none; }
  .stamp { position: absolute; top: calc(62vh - 4.5rem); bottom: auto; right: 1rem; width: 6rem; }
}
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage" aria-hidden="true"><canvas id="c"></canvas></div>
<div class="veil"></div>
<div class="grain"></div>

<main>
  <p class="hello">Hi, I’m</p>
  <h1>Ebun Kadeba</h1>
  <p class="lede">I’ve been quietly building a little corner of the internet that’s mine. It opens soon.</p>
  <form id="notify" novalidate>
    <label for="email">Want a note when it’s live?</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button type="submit">Notify me</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="hint" id="hint">Drag the scene to walk around her.</p>
</main>

<div class="stamp" aria-label="Coming soon" role="img"><svg viewBox="0 0 200 200">
  <defs><path id="ring" d="M100,100 m-72,0 a72,72 0 1,1 144,0 a72,72 0 1,1 -144,0"/></defs>
  <circle cx="100" cy="100" r="96" fill="#F2A33A"/>
  <text font-family="Bricolage Grotesque, sans-serif" font-weight="700" font-size="21" letter-spacing="5" fill="#123D36"><textPath href="#ring" textLength="440" lengthAdjust="spacing">COMING SOON · COMING SOON ·</textPath></text>
  <circle cx="100" cy="100" r="40" fill="#123D36"/>
  <text x="100" y="114" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="40" fill="#F2A33A">ek</text>
</svg></div>

<script type="module">
import * as THREE from 'three';

// Palette: mist, pine, marigold, cobalt (her real scrubs), sage
const C = {
  mist: 0xE9EEE6, pine: 0x123D36, marigold: 0xF2A33A, cobalt: 0x2446B5,
  cobaltDeep: 0x1A3389, sage: 0x9DBB9A, sageDeep: 0x6F9470,
  skin: 0x8A5536, hair: 0x1A1E36, hairHi: 0x2E3A6B, gold: 0xE9B44C,
  lip: 0xA9445F, white: 0xF7F5F0, path: 0xD9D2C3
};

function noiseCanvas(size = 256, amp = 40, base = 128) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const d = g.createImageData(size, size);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = base + (Math.random() - .5) * amp * 2;
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  // a few soft blotches for a hand-made clay feel
  for (let k = 0; k < 60; k++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? 0 : 255},0,0,0)`;
    const r = 4 + Math.random() * 18, x = Math.random() * size, y = Math.random() * size;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const s = Math.random() < .5 ? 0 : 255;
    grd.addColorStop(0, `rgba(${s},${s},${s},.10)`); grd.addColorStop(1, `rgba(${s},${s},${s},0)`);
    g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function braidCanvas() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 64);
  g.strokeStyle = '#fff'; g.lineWidth = 9;
  for (let k = -1; k < 3; k++) {
    g.beginPath(); g.moveTo(k * 32, 0); g.lineTo(k * 32 + 32, 32); g.lineTo(k * 32, 64); g.stroke();
  }
  g.strokeStyle = '#000'; g.lineWidth = 3;
  for (let k = -1; k < 3; k++) {
    g.beginPath(); g.moveTo(k * 32 + 10, 0); g.lineTo(k * 32 + 42, 32); g.lineTo(k * 32 + 10, 64); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

function pathCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const g = c.getContext('2d'); g.fillStyle = '#cfc6b4'; g.fillRect(0, 0, 256, 512);
  const cols = ['#e2dccd', '#d8d0bf', '#ebe5d8', '#d2c9b6'];
  for (let y = 0; y < 512; y += 64) for (let x = (y / 64) % 2 ? -64 : 0; x < 256; x += 128) {
    g.fillStyle = cols[(x / 64 + y / 64 + 8) % 4 | 0];
    g.beginPath(); g.roundRect(x + 4, y + 4, 120, 56, 10); g.fill();
  }
  const d = g.getImageData(0, 0, 256, 512);
  for (let i = 0; i < d.data.length; i += 4) { const n = (Math.random() - .5) * 26; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; }
  g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

function build(canvas, { width, height, pixelRatio = 1, shadowSize = 2048, dark = false }) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false });
  renderer.setPixelRatio(pixelRatio); renderer.setSize(width, height, false);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const bgCol = dark ? 0x10261F : C.mist;
  scene.background = new THREE.Color(bgCol);
  scene.fog = new THREE.Fog(bgCol, 6, 16);
  const camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 60);

  scene.add(new THREE.HemisphereLight(0xfff4e4, 0x7f9e7c, 1.1));
  const sun = new THREE.DirectionalLight(0xffe0b0, 2.6);
  sun.position.set(3, 6, 3); sun.castShadow = true;
  sun.shadow.mapSize.set(shadowSize, shadowSize);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: .5, far: 20 });
  sun.shadow.radius = 4; sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0xbfd8ff, 1.4); rim.position.set(-3, 3, -4); scene.add(rim);

  const clay = noiseCanvas();
  const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .62, metalness: 0, bumpMap: clay, bumpScale: .6, ...o });
  const M = {
    skin: mat(C.skin, { roughness: .5 }), cobalt: mat(C.cobalt), cobaltDeep: mat(C.cobaltDeep),
    hair: mat(C.hair, { roughness: .45 }), white: mat(C.white), eyeW: mat(0xffffff, { roughness: .2, bumpScale: 0 }),
    iris: mat(0x1a1210, { roughness: .1, bumpScale: 0 }), gold: new THREE.MeshStandardMaterial({ color: C.gold, metalness: .9, roughness: .25 }),
    lip: mat(C.lip, { roughness: .35 }), lipLo: mat(0xBC5772, { roughness: .3 }), brow: mat(0x120d0c),
    marigold: mat(C.marigold), lanyard: mat(C.marigold), sage: mat(C.sage), sageDeep: mat(C.sageDeep), pine: mat(C.pine),
  };
  const braidTex = braidCanvas(); braidTex.repeat.set(26, 1);
  M.braid = new THREE.MeshStandardMaterial({ color: C.hair, roughness: .4, bumpMap: braidTex, bumpScale: 3 });
  const braidHi = braidTex.clone(); braidHi.needsUpdate = true;

  const mesh = (geo, m, parent, pos = [0, 0, 0], scale = [1, 1, 1], rot = [0, 0, 0]) => {
    const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.scale.set(...scale); o.rotation.set(...rot);
    o.castShadow = true; o.receiveShadow = true; parent.add(o); return o;
  };
  const group = (parent, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; };
  const cap = (r, l) => new THREE.CapsuleGeometry(r, l, 8, 20);
  const sph = (r) => new THREE.SphereGeometry(r, 40, 28);

  // ---------- world ----------
  const ground = mesh(new THREE.PlaneGeometry(60, 60), mat(dark ? 0x2C4A3F : 0xDCE5D6, { bumpScale: .3 }), scene, [0, 0, 0], [1, 1, 1], [-Math.PI / 2, 0, 0]);
  ground.castShadow = false;
  const pathTex = pathCanvas(); pathTex.repeat.set(1, 6);
  const path = mesh(new THREE.BoxGeometry(1.3, .02, 30), new THREE.MeshStandardMaterial({ map: pathTex, roughness: .9 }), scene, [0, .01, 0]);
  path.castShadow = false;
  // map only the top face correctly by using a plane on top
  const pathTop = mesh(new THREE.PlaneGeometry(1.3, 30), new THREE.MeshStandardMaterial({ map: pathTex, roughness: .9 }), scene, [0, .021, 0], [1, 1, 1], [-Math.PI / 2, 0, 0]);
  pathTop.castShadow = false;

  const props = [];
  const rng = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const makeTree = () => {
    const g = new THREE.Group();
    mesh(new THREE.CylinderGeometry(.05, .07, .9, 12), mat(0x7A5A3E), g, [0, .45, 0]);
    const k = .8 + rng() * .5;
    mesh(new THREE.IcosahedronGeometry(.45 * k, 2), M.sageDeep, g, [0, 1.15 * k, 0]);
    mesh(new THREE.IcosahedronGeometry(.32 * k, 2), M.sage, g, [.18, 1.4 * k, .1]);
    return g;
  };
  const makeBush = () => {
    const g = new THREE.Group();
    mesh(new THREE.IcosahedronGeometry(.28, 2), M.sage, g, [0, .2, 0], [1.3, .8, 1]);
    for (let i = 0; i < 6; i++) {
      const a = rng() * Math.PI * 2;
      mesh(sph(.045), M.marigold, g, [Math.cos(a) * .28, .3 + rng() * .12, Math.sin(a) * .22]);
    }
    return g;
  };
  const makeLamp = () => {
    const g = new THREE.Group();
    mesh(new THREE.CylinderGeometry(.025, .035, 1.8, 10), M.pine, g, [0, .9, 0]);
    mesh(sph(.09), new THREE.MeshStandardMaterial({ color: 0xFFE9B8, emissive: 0xF2A33A, emissiveIntensity: .35, roughness: .3 }), g, [0, 1.85, 0]);
    return g;
  };
  const SPAN = 24;
  for (let i = 0; i < 18; i++) {
    const side = i % 3 === 0 ? 1 : -1;
    const kind = side > 0 ? makeBush() : (i % 4 === 1 ? makeLamp() : (rng() < .6 ? makeTree() : makeBush()));
    kind.position.set(side > 0 ? 2.7 + rng() * .8 : -(1.15 + rng() * 1.6), 0, -12 + (i / 18) * SPAN + rng() * .6);
    kind.rotation.y = rng() * 6;
    kind.userData.z0 = kind.position.z;
    scene.add(kind); props.push(kind);
  }

  // ---------- character ----------
  const root = group(scene);
  const body = group(root, [0, 0, 0]);

  // legs
  const legs = [];
  for (const s of [-1, 1]) {
    const hip = group(body, [s * .085, .86, 0]);
    mesh(cap(.078, .26), M.cobalt, hip, [0, -.19, 0]);
    const knee = group(hip, [0, -.4, 0]);
    mesh(cap(.068, .28), M.cobalt, knee, [0, -.18, 0]);
    mesh(new THREE.CylinderGeometry(.072, .072, .04, 20), M.cobaltDeep, knee, [0, -.355, 0]);
    // trainer
    const shoe = group(knee, [0, -.42, .04]);
    mesh(cap(.062, .12), M.white, shoe, [0, 0, 0], [1, .75, 1], [Math.PI / 2, 0, 0]);
    mesh(new THREE.BoxGeometry(.105, .02, .22), M.marigold, shoe, [0, -.042, 0]);
    mesh(new THREE.BoxGeometry(.005, .03, .1), M.marigold, shoe, [s * .062, .0, -.01]);
    legs.push({ hip, knee });
  }
  // pelvis + torso (scrubs)
  mesh(sph(.18), M.cobalt, body, [0, .9, 0], [1, .55, .78]);
  const chest = group(body, [0, 0, 0]);
  const prof = [[.0,.86],[.17,.87],[.19,.93],[.17,1.03],[.158,1.09],[.172,1.18],[.182,1.25],[.17,1.31],[.12,1.355],[.05,1.37],[0,1.372]].map(([r,y]) => new THREE.Vector2(r, y));
  mesh(new THREE.LatheGeometry(prof, 48), M.cobalt, chest, [0, 0, 0], [1.08, 1, .74]);
  mesh(new THREE.CylinderGeometry(.19, .2, .05, 30), M.cobaltDeep, chest, [0, .935, 0], [1.06, 1, .78]);
  // V-neck: skin diamond with darker trim
  { const sh = new THREE.Shape(); sh.moveTo(-.05, .035); sh.lineTo(.05, .035); sh.lineTo(0, -.06); sh.closePath();
    mesh(new THREE.ShapeGeometry(sh), M.skin, chest, [0, 1.325, .117], [1, 1, 1], [-.38, 0, 0]); }
  for (const s of [-1, 1]) mesh(cap(.007, .09), M.cobaltDeep, chest, [s * .026, 1.305, .121], [1, 1, 1], [-.38, 0, s * .55]);
  // pocket + badge on lanyard
  mesh(new THREE.BoxGeometry(.09, .08, .01), M.cobaltDeep, chest, [-.085, 1.17, .128]);
  for (const s of [-1, 1]) {
    mesh(new THREE.BoxGeometry(.012, .2, .006), M.lanyard, chest, [s * .042, 1.2, .132], [1, 1, 1], [-.1, 0, s * -.13]);
  }
  const badge = group(chest, [.0, 1.07, .14]); badge.scale.setScalar(.8);
  mesh(new THREE.BoxGeometry(.07, .095, .008), M.white, badge, [0, 0, 0]);
  mesh(new THREE.BoxGeometry(.07, .022, .009), M.marigold, badge, [0, .036, .001]);
  mesh(new THREE.CylinderGeometry(.014, .014, .01, 16), mat(0xC9D6E8), badge, [0, .005, .006], [1, 1, 1], [Math.PI / 2, 0, 0]);

  // arms
  const arms = [];
  for (const s of [-1, 1]) {
    const sh = group(chest, [s * .215, 1.29, 0]);
    mesh(cap(.06, .08), M.cobalt, sh, [s * .008, -.06, 0], [1, 1, .95]);
    mesh(cap(.048, .18), M.skin, sh, [s * .012, -.17, 0]);
    const el = group(sh, [s * .012, -.29, 0]);
    mesh(cap(.043, .18), M.skin, el, [0, -.12, 0]);
    const hand = mesh(sph(.052), M.skin, el, [0, -.27, .01], [.85, 1.1, .9]);
    arms.push({ sh, el, s });
  }
  // coffee cup in her right hand
  const cup = group(arms[1].el, [.0, -.3, .06]);
  mesh(new THREE.CylinderGeometry(.05, .04, .14, 24), M.white, cup, [0, 0, 0]);
  mesh(new THREE.CylinderGeometry(.051, .046, .05, 24), M.marigold, cup, [0, -.005, 0]);
  mesh(new THREE.CylinderGeometry(.055, .055, .02, 24), M.pine, cup, [0, .078, 0]);

  // neck + head
  const neckG = group(chest, [0, 0, 0]);
  mesh(new THREE.CylinderGeometry(.052, .058, .13, 20), M.skin, neckG, [0, 1.385, 0]);
  const head = group(neckG, [0, 1.58, 0]);
  const headGeo = new THREE.SphereGeometry(.16, 64, 48);
  { const p = headGeo.attributes.position;
    for (let i = 0; i < p.count; i++) { const y = p.getY(i) / .16;
      const k = y < 0 ? 1 - .28 * Math.pow(-y, 1.6) : 1 - .04 * y;
      p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * (y < 0 ? 1 - .1 * Math.pow(-y, 2) : 1)); }
    headGeo.computeVertexNormals(); }
  mesh(headGeo, M.skin, head, [0, 0, 0], [1, 1.16, .98]);
  // ears + hoops
  const hoops = [];
  for (const s of [-1, 1]) {
    mesh(sph(.034), M.skin, head, [s * .157, -.01, -.01], [.5, 1, .8]);
    const hg = group(head, [s * .165, -.05, 0]);
    mesh(new THREE.TorusGeometry(.024, .0045, 10, 40), M.gold, hg, [0, -.024, 0], [1, 1, 1], [0, Math.PI / 2, 0]);
    hoops.push(hg);
  }
  // eyes
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = group(head, [s * .057, .025, .13]);
    mesh(sph(.034), M.eyeW, e, [0, 0, 0], [1.1, .78, .45]);
    mesh(sph(.019), M.iris, e, [0, -.002, .011], [1, 1, .55]);
    mesh(sph(.0055), M.eyeW, e, [.007, .007, .018]);
    const lid = mesh(new THREE.TorusGeometry(.036, .0045, 8, 24, 2.2), M.brow, e, [0, -.006, .008], [1, .78, 1], [0, 0, Math.PI / 2 - 1.1]);
    mesh(cap(.0035, .016), M.brow, e, [s * .038, .016, .006], [1, 1, 1], [0, 0, -s * .8]);
    const brow = mesh(new THREE.TorusGeometry(.05, .0055, 8, 24, 1.1), M.brow, head, [s * .06, .045, .128], [1, .7, .6], [0, 0, Math.PI / 2 - .55 + s * -.08]);
    eyes.push(e);
  }
  // nose
  mesh(sph(.02), M.skin, head, [0, -.032, .155], [1.3, .75, .7]);
  for (const s of [-1, 1]) mesh(sph(.012), mat(0x6A3F28), head, [s * .014, -.04, .15], [.7, .5, .5]);
  // lips with a soft closed smile
  mesh(sph(.028), M.lip, head, [0, -.088, .133], [1.15, .3, .5]);
  mesh(sph(.028), M.lipLo, head, [0, -.108, .13], [1.0, .42, .5]);
  { const pts = [-1, -.5, 0, .5, 1].map(u => new THREE.Vector3(u * .04, -.097 + .012 * u * u, .147 - .02 * u * u));
    mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, .0028, 6), mat(0x4A1A26), head); }

  // hair cap with cornrows
  const hairG = group(head, [0, 0, 0]);
  const capGeo = new THREE.SphereGeometry(.168, 48, 32, 0, Math.PI * 2, 0, 1.3);
  mesh(capGeo, M.hair, hairG, [0, .012, -.012], [1, 1.16, 1], [-.72, 0, 0]);
  const rowMat = new THREE.MeshStandardMaterial({ color: C.hairHi, roughness: .4, bumpMap: braidTex, bumpScale: 2 });
  for (let i = -5; i <= 5; i++) {
    const ph = i * .19, pts = [];
    for (let k = 0; k <= 24; k++) {
      const a = .78 + k * .08;
      pts.push(new THREE.Vector3(Math.sin(ph) * .172, Math.sin(a) * .196 * Math.cos(ph) + .012, Math.cos(a) * .17 * Math.cos(ph) - .006));
    }
    mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, .011, 8, false), rowMat, hairG);
  }
  // braids
  const braidGroups = [];
  const braidSet = (n, startFn, endFn, len, parent) => {
    const g = group(parent, [0, 0, 0]);
    for (let i = 0; i < n; i++) {
      const u = n === 1 ? .5 : i / (n - 1);
      const a = startFn(u), b = endFn(u);
      const mid1 = a.clone().lerp(b, .33).add(new THREE.Vector3(0, 0, -.04));
      const mid2 = a.clone().lerp(b, .66).add(new THREE.Vector3(0, 0, -.02));
      const curve = new THREE.CatmullRomCurve3([a, mid1, mid2, b]);
      const tex = braidTex.clone(); tex.repeat.set(len * 22, 1); tex.needsUpdate = true;
      const m = new THREE.MeshStandardMaterial({ color: i % 3 ? C.hair : C.hairHi, roughness: .4, bumpMap: tex, bumpScale: 3 });
      const tube = mesh(new THREE.TubeGeometry(curve, 48, .017, 8, false), m, g);
      mesh(sph(.018), m, g, [b.x, b.y, b.z]);
    }
    return g;
  };
  // down the back
  const backBraids = braidSet(14,
    u => new THREE.Vector3((u - .5) * .26, .02 - Math.abs(u - .5) * .1, -.13 + Math.abs(u - .5) * .05),
    u => new THREE.Vector3((u - .5) * .3, -.58 - Math.sin(u * 3.1) * .05, -.25),
    .7, head);
  // over her right shoulder, in front
  const frontBraids = braidSet(5,
    u => new THREE.Vector3(.13 + u * .03, -.02 - u * .03, -.04 + u * .02),
    u => new THREE.Vector3(.15 + u * .04, -.5 - u * .05, .1 + u * .03),
    .55, head);
  braidGroups.push(backBraids, frontBraids);

  // ---------- animation ----------
  const P = 1.1; // stride cycle seconds
  const speed = 1.15; // m/s the world moves past her
  function pose(t) {
    const w = (t / P) * Math.PI * 2;
    legs.forEach((L, i) => {
      const ph = w + (i ? Math.PI : 0);
      L.hip.rotation.x = -.38 * Math.cos(ph);
      L.knee.rotation.x = .08 + 1.05 * Math.pow(Math.max(0, -Math.sin(ph)), 1.3);
    });
    arms.forEach((A, i) => {
      const ph = w + (i ? Math.PI : 0);
      A.sh.rotation.x = .34 * Math.cos(ph);
      A.sh.rotation.z = A.s * .05;
      A.el.rotation.x = -.35 - .25 * Math.max(0, -Math.cos(ph));
    });
    arms[1].el.rotation.x -= .35; // cup arm stays bent
    body.position.y = -.025 * Math.cos(2 * w) - .012;
    body.rotation.y = .06 * Math.sin(w);
    chest.rotation.y = -.1 * Math.sin(w);
    chest.rotation.x = .04;
    head.rotation.y = .1 * Math.sin(w) + .05;
    head.rotation.z = .03 * Math.sin(w);
    braidGroups[0].rotation.x = .08 + .06 * Math.sin(2 * w - .8);
    braidGroups[0].rotation.z = .05 * Math.sin(w - .6);
    braidGroups[1].rotation.x = -.05 + .05 * Math.sin(2 * w - .6);
    hoops.forEach((h, i) => { h.rotation.x = .35 * Math.sin(2 * w - .7 + i); });
    // blink every ~3.7s
    const bt = t % 3.7, blink = bt > 3.55 ? Math.sin((bt - 3.55) / .15 * Math.PI) : 0;
    eyes.forEach(e => e.scale.y = 1 - .9 * blink);
    // world scroll
    const off = (t * speed);
    pathTex.offset.y = off / 5;
    props.forEach(p => { let z = p.userData.z0 - off; z = ((z + 12) % SPAN + SPAN) % SPAN - 12; p.position.z = z; });
  }

  function render(t, cam) {
    pose(t);
    camera.position.set(...cam.pos); camera.lookAt(...cam.target);
    if (cam.fov) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
    renderer.render(scene, camera);
  }
  function resize(w, h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  return { render, resize, root, scene, camera, renderer };
}


const stage = document.getElementById('stage'), canvas = document.getElementById('c');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const darkQ = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : darkQ.matches;
let S, wide = innerWidth > 760;
function size() { const r = stage.getBoundingClientRect(); return [Math.max(1, r.width), Math.max(1, r.height)]; }
try {
  const [w, h] = size();
  S = build(canvas, { width: w, height: h, pixelRatio: Math.min(devicePixelRatio, 2), shadowSize: 1024, dark: isDark() });
} catch (e) { stage.style.display = 'none'; document.getElementById('hint').hidden = true; }

let yaw = -20, drag = null, t0 = performance.now(), frozenT = .3;
function cam(t) {
  wide = innerWidth > 760;
  const a = (yaw + (reduce ? 0 : Math.sin(t * .15) * 6)) * Math.PI / 180;
  const r = wide ? 5.4 : 5.0, tx = wide ? -1.25 : 0;
  return { pos: [Math.sin(a) * r + tx, wide ? 1.6 : 1.5, Math.cos(a) * r], target: [tx, wide ? .95 : .9, 0], fov: wide ? 30 : 34 };
}
function frame(now) {
  if (!S) return;
  const t = reduce ? frozenT : (now - t0) / 1000;
  S.render(t, cam(t));
  if (!reduce) requestAnimationFrame(frame);
}
if (S) {
  requestAnimationFrame(frame);
  addEventListener('resize', () => { const [w, h] = size(); S.resize(w, h); if (reduce) frame(0); });
  stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, yaw }; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (!drag) return; yaw = drag.yaw - (e.clientX - drag.x) * .35; if (reduce) frame(0); });
  addEventListener('pointerup', () => drag = null);
}

const FORM_ENDPOINT = ""; // paste a form endpoint (e.g. https://formspree.io/f/xxxx) to collect sign-ups
const form = document.getElementById('notify'), msg = document.getElementById('msg'), email = document.getElementById('email');
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!email.checkValidity()) { msg.textContent = 'Enter an email address like name@example.com.'; email.focus(); return; }
  if (!FORM_ENDPOINT) { msg.textContent = 'Sign-ups aren’t connected yet. Add a form endpoint in the page script.'; return; }
  msg.textContent = 'Adding you…';
  try {
    const res = await fetch(FORM_ENDPOINT, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(form) });
    if (!res.ok) throw new Error();
    form.reset(); msg.textContent = 'You’re on the list. You’ll hear from me when it’s live.';
  } catch { msg.textContent = 'That didn’t go through. Check your connection and try again.'; }
});
</script>
